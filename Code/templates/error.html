<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ошибка | SmartMiner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Montserrat", sans-serif;
            background: linear-gradient(-45deg, #1c1b1b, #2b2b2b, #4a3500, #1c1b1b);
            background-size: 400% 400%;
            color: #e9ecef;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: rgba(43, 43, 43, 0.85);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }
        .error-icon { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #ff4757; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #adb5bd; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #1c1b1b;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h1>Что-то пошло не так</h1>
        <p>Произошла непредвиденная ошибка. Попробуйте повторить действие или вернитесь на главную страницу.</p>
        <a href="/" class="btn">НА ГЛАВНУЮ</a>
    </div>
</body>
</html>
