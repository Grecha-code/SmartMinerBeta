{% extends 'base.html' %}
{% block title %}Вход | SMART MINER{% endblock %}
{% block content %}
<div class="header" style="margin-top: 50px;">
    <div style="font-size: 60px; margin-bottom: 10px; animation: float 3s infinite;">⛏️</div>
    <h1>SMART MINER</h1>
    <p style="color: #8c959f;">Промышленный портал безопасности</p>
</div>

<div class="card">
    <form action="/" method="POST" autocomplete="off">
        <div class="form-group">
            <input type="text" name="login" placeholder="Табельный номер (Логин)" required autocomplete="off">
        </div>
        <div class="form-group">
            <input type="password" name="miner_pass" placeholder="Код доступа (Пароль)" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-main" style="animation: pulseBorder 2s infinite;">АВТОРИЗАЦИЯ</button>
    </form>
</div>
{% endblock %}
